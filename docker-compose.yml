# Production-like stack: http://localhost:8080
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      API_PORT: "3001"
      CACHE_DIR: /data
    volumes:
      - bce-cache:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_UPSTREAM: http://api:3001
    ports:
      - "${WEB_PUBLIC_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  bce-cache:
