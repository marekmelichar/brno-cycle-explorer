name: Tests

# Reusable test suite: runs on every pull request and before every production build (deploy.yml).
on:
  pull_request:
  workflow_call:
    inputs:
      e2e:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck, unit + integration tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests (Playwright, real map + live services)
    # Uses live third-party services (OpenFreeMap, Brno ArcGIS, Valhalla), so it informs but never
    # blocks a deploy; it runs on pull requests and when called with e2e: true.
    if: github.event_name == 'pull_request' || inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
